<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Encoder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #eee;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88;
        }
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        h2 {
            color: #00d9ff;
            margin-bottom: 15px;
            font-size: 1.1em;
        }
        textarea {
            width: 100%;
            height: 200px;
            background: #0a0a15;
            border: 1px solid #333;
            border-radius: 8px;
            color: #00ff88;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            padding: 15px;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #00d9ff;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.8; }
        .btn-primary {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #1a1a2e;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #eee;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .instructions {
            background: rgba(0,217,255,0.1);
            border-left: 3px solid #00d9ff;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 0 8px 8px 0;
        }
        .instructions h3 {
            color: #00d9ff;
            margin-bottom: 10px;
        }
        .instructions ol {
            margin-left: 20px;
            color: #aaa;
        }
        .instructions li { margin-bottom: 5px; }
        .instructions code {
            background: rgba(0,0,0,0.3);
            padding: 2px 6px;
            border-radius: 4px;
            color: #00ff88;
        }
        a { color: #00d9ff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Content Encoder</h1>

        <div class="instructions">
            <h3>How to add a new game:</h3>
            <ol>
                <li>Paste your complete HTML game code below</li>
                <li>Click "Encode" to generate the encoded version</li>
                <li>Save the output as <code>games/[name].dat</code></li>
                <li>Add entry to games array in <code>index.html</code></li>
            </ol>
        </div>

        <div class="section">
            <h2>Input (Raw HTML)</h2>
            <textarea id="input" placeholder="Paste your HTML game code here..."></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="encode()">Encode →</button>
                <button class="btn btn-secondary" onclick="document.getElementById('input').value=''">Clear</button>
            </div>
        </div>

        <div class="section">
            <h2>Output (Encoded)</h2>
            <textarea id="output" placeholder="Encoded output will appear here..." readonly></textarea>
            <div class="btn-row">
                <button class="btn btn-primary" onclick="copyOutput()">Copy to Clipboard</button>
                <button class="btn btn-secondary" onclick="downloadOutput()">Download .dat</button>
            </div>
        </div>

        <p style="text-align:center; margin-top:20px;">
            <a href="index.html">← Back to Library</a>
        </p>
    </div>

    <script>
        function encode() {
            const input = document.getElementById('input').value;
            if (!input.trim()) {
                alert('Please paste some HTML first');
                return;
            }

            // ROT13 first
            let encoded = input.replace(/[a-zA-Z]/g, c =>
                String.fromCharCode(
                    c.charCodeAt(0) + (c.toLowerCase() < 'n' ? 13 : -13)
                )
            );
            // Then Base64
            encoded = btoa(encoded);

            document.getElementById('output').value = encoded;
        }

        function copyOutput() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function downloadOutput() {
            const output = document.getElementById('output').value;
            if (!output) {
                alert('Nothing to download');
                return;
            }

            const filename = prompt('Enter filename (without .dat):', 'game');
            if (!filename) return;

            const blob = new Blob([output], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename + '.dat';
            a.click();
        }
    </script>
</body>
</html>
