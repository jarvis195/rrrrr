<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading Resource...</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; }
        #loader {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #1a1a2e;
            color: #00d9ff;
            font-family: monospace;
            font-size: 1.2em;
        }
        #frame {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .back-btn {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 9999;
            padding: 8px 16px;
            background: rgba(0,0,0,0.7);
            color: #00d9ff;
            border: 1px solid #00d9ff;
            border-radius: 5px;
            cursor: pointer;
            font-family: monospace;
            text-decoration: none;
        }
        .back-btn:hover { background: rgba(0,217,255,0.2); }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">← Back</a>
    <div id="loader">Decoding resource...</div>
    <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe>

    <script>
        // Decode function - reverses the encoding
        function decode(encoded) {
            try {
                // Base64 decode
                let decoded = atob(encoded);
                // ROT13 for extra obfuscation
                decoded = decoded.replace(/[a-zA-Z]/g, c =>
                    String.fromCharCode(
                        c.charCodeAt(0) + (c.toLowerCase() < 'n' ? 13 : -13)
                    )
                );
                return decoded;
            } catch(e) {
                console.error('Decode error:', e);
                return null;
            }
        }

        async function loadGame() {
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('g');

            if (!gameId) {
                document.getElementById('loader').textContent = 'No resource specified';
                return;
            }

            try {
                // Fetch the encoded game data
                const response = await fetch(`games/${gameId}.dat`);
                if (!response.ok) throw new Error('Resource not found');

                const encoded = await response.text();
                const html = decode(encoded.trim());

                if (!html) throw new Error('Decode failed');

                // Load into iframe
                const frame = document.getElementById('frame');
                const blob = new Blob([html], { type: 'text/html' });
                frame.src = URL.createObjectURL(blob);

                document.getElementById('loader').style.display = 'none';
                frame.style.display = 'block';

            } catch(e) {
                document.getElementById('loader').textContent = 'Failed to load: ' + e.message;
            }
        }

        loadGame();
    </script>
</body>
</html>
